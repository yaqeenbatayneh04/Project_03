<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 02 - Live DOM Tree</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <h1 id="title">Original Title</h1>
        <p class="description">This is the original text description.</p>
        <div id="box" class="box">Dynamic Box</div>

        <div class="buttons">
            <button id="change-text">Change Text</button>
            <button id="change-style">Change Style</button>
            <button id="add-class">Add Class</button>
            <button id="remove-class">Remove Class</button>
        </div>
    </main>

</body>
</html>
